name: check

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogo:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Verificar catalogo (estructura, triggers, evals, frescura, encoding)
        shell: pwsh
        run: ./tools/check.ps1
      - name: Pruebas de integracion (install.ps1 / check.ps1)
        shell: pwsh
        run: ./tools/test.ps1
